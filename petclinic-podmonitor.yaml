apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: petclinic
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - petclinic
  selector:
    matchLabels:
      app: petclinic
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
