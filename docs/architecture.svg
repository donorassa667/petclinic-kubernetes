<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" style="background:#ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <!-- Titre -->
  <text x="450" y="40" text-anchor="middle" fill="#333333" font-size="22" font-weight="bold">Architecture Spring PetClinic sur AWS EKS</text>
  <text x="450" y="65" text-anchor="middle" fill="#666666" font-size="14">Déploiement cloud-native avec composants AWS</text>

  <!-- Internet Utilisateur -->
  <ellipse cx="450" cy="110" rx="100" ry="40" fill="#4a90e2" stroke="#2c5aa0" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Client<br/></text>

  <!-- Flèche vers LoadBalancer -->
  <line x1="450" y1="150" x2="450" y2="180" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="170" text-anchor="middle" fill="#666666" font-size="10">HTTPS/HTTP</text>

  <!-- AWS Load Balancer (Ingress Nginx) -->
  <rect x="350" y="180" width="200" height="70" rx="10" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="205" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">AWS Load Balancer</text>
  <text x="450" y="225" text-anchor="middle" fill="#ffffff" font-size="12">Ingress Nginx Controller</text>
  <text x="450" y="240" text-anchor="middle" fill="#ffffff" font-size="10">Type: LoadBalancer</text>

  <!-- EKS Cluster (Conteneur) -->
  <rect x="100" y="260" width="700" height="430" rx="15" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="450" y="280" text-anchor="middle" fill="#666666" font-size="12">Amazon EKS Cluster (eu-north-1)</text>

  <!-- PetClinic Pods -->
  <rect x="150" y="300" width="200" height="80" rx="10" fill="#ff6b6b" stroke="#d32f2f" stroke-width="2"/>
  <text x="250" y="320" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Pod: PetClinic-1</text>
  <text x="250" y="340" text-anchor="middle" fill="#ffffff" font-size="12">Image: ECR</text>
  <text x="250" y="355" text-anchor="middle" fill="#ffffff" font-size="10">Port: 8080</text>

  <rect x="550" y="300" width="200" height="80" rx="10" fill="#ff6b6b" stroke="#d32f2f" stroke-width="2"/>
  <text x="650" y="320" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Pod: PetClinic-2</text>
  <text x="650" y="340" text-anchor="middle" fill="#ffffff" font-size="12">Image: ECR</text>
  <text x="650" y="355" text-anchor="middle" fill="#ffffff" font-size="10">Port: 8080</text>

  <!-- Flèches LoadBalancer → Pods -->
  <line x1="450" y1="250" x2="250" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="250" x2="650" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="270" text-anchor="middle" fill="#666666" font-size="10">Load Balancing</text>

  <!-- Amazon ECR -->
  <rect x="110" y="450" width="150" height="60" rx="8" fill="#ffb300" stroke="#e53935" stroke-width="1.5"/>
  <text x="185" y="475" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Amazon ECR</text>
  <text x="185" y="490" text-anchor="middle" fill="#ffffff" font-size="10">petclinic:1.0</text>

<!-- ConfigMap & Secret -->
  <rect x="650" y="400" width="100" height="60" rx="8" fill="#ffcc80" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="700" y="425" text-anchor="middle" fill="#333333" font-size="11" font-weight="bold">ConfigMap</text>
  <text x="700" y="440" text-anchor="middle" fill="#333333" font-size="10">• APP_CONFIG</text>

  <rect x="650" y="470" width="100" height="60" rx="8" fill="#ffcdd2" stroke="#e53935" stroke-width="1.5"/>
  <text x="700" y="495" text-anchor="middle" fill="#333333" font-size="11" font-weight="bold">Secret</text>
  <text x="700" y="510" text-anchor="middle" fill="#333333" font-size="10">• MYSQL_USER</text>

  <!-- Flèche ConfigMap & Secret → Pods -->
  <line x1="650" y1="500" x2="250" y2="380" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="710" y1="400" x2="650" y2="380" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Flèche ECR → Pods -->
  <line x1="175" y1="450" x2="250" y2="380" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="175" y1="450" x2="650" y2="380" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  
  <!-- Service MySQL -->
  <rect x="350" y="480" width="200" height="50" rx="8" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="505" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Service MySQL</text>
  <text x="450" y="520" text-anchor="middle" fill="#ffffff" font-size="10">ClusterIP: mysql:3306</text>

  <!-- Flèches Pods → MySQL -->
  <line x1="250" y1="380" x2="450" y2="480" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="380" x2="450" y2="480" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="440" text-anchor="middle" fill="#666666" font-size="10">SQL Queries</text>
  <text x="550" y="440" text-anchor="middle" fill="#666666" font-size="10">SQL Queries</text>
  
  

  <!-- Pod MySQL -->
  <rect x="350" y="550" width="200" height="60" rx="8" fill="#9575cd" stroke="#673ab7" stroke-width="2"/>
  <text x="450" y="570" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Pod: MySQL</text>
  <text x="450" y="585" text-anchor="middle" fill="#ffffff" font-size="12">StatefulSet</text>
  <text x="450" y="600" text-anchor="middle" fill="#ffffff" font-size="10">Port: 3306</text>

  <!-- Flèche Service → Pod MySQL -->
  <line x1="450" y1="530" x2="450" y2="550" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Amazon EBS (via CSI Driver) -->
  <rect x="570" y="550" width="180" height="60" rx="8" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <text x="660" y="570" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Amazon EBS</text>
  <text x="660" y="585" text-anchor="middle" fill="#ffffff" font-size="10">gp2 • 5Gi • RWO</text>
  <text x="660" y="600" text-anchor="middle" fill="#ffffff" font-size="10">via CSI Driver</text>

  <!-- Flèche MySQL → EBS -->
  <line x1="550" y1="580" x2="570" y2="580" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="570" text-anchor="middle" fill="#666666" font-size="10">Mount</text>

  <!-- Légende -->
  <rect x="150" y="670" width="600" height="60" rx="10" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
  <text x="160" y="685" fill="#333333" font-size="12" font-weight="bold">Légende:</text>
  <rect x="160" y="700" width="20" height="10" fill="#ff6b6b" stroke="#d32f2f" stroke-width="1"/>
  <text x="185" y="708" fill="#333333" font-size="10">Application</text>
  <rect x="250" y="700" width="20" height="10" fill="#9575cd" stroke="#673ab7" stroke-width="1"/>
  <text x="275" y="708" fill="#333333" font-size="10">Base de données</text>
  <rect x="355" y="700" width="20" height="10" fill="#66bb6a" stroke="#2e7d32" stroke-width="1"/>
  <text x="380" y="708" fill="#333333" font-size="10">Service K8s / Load Balancer</text>
  <rect x="510" y="700" width="20" height="10" fill="#ffb300" stroke="#e53935" stroke-width="1"/>
  <text x="535" y="708" fill="#333333" font-size="10">Amazon ECR</text>
  <rect x="620" y="700" width="20" height="10" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
  <text x="645" y="708" fill="#333333" font-size="10">Amazon EBS</text>

  <!-- Définition de la flèche -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333" />
    </marker>
  </defs>
</svg>