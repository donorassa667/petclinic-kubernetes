<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" font-family="sans-serif">
  <!-- Titre -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold">Architecture PetClinic sur Minikube (EC2)</text>

  <!-- Machine locale -->
  <rect x="50" y="80" width="180" height="120" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" font-weight="bold">Machine locale</text>
  <text x="140" y="135" text-anchor="middle">Navigateur</text>
  <text x="140" y="155" text-anchor="middle">SSH Client</text>
  <text x="140" y="175" text-anchor="middle">/etc/hosts → petclinic.local</text>

  <!-- Flèche vers EC2 -->
  <line x1="230" y1="140" x2="320" y2="140" stroke="#333" marker-end="url(#arrow)"/>
  <text x="275" y="130" text-anchor="middle" font-size="12">HTTP / SSH</text>

  <!-- EC2 Instance -->
  <rect x="320" y="60" width="530" height="480" rx="15" fill="#f5f5f5" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="585" y="90" text-anchor="middle" font-weight="bold" fill="#333">Instance EC2 (AWS)</text>

  <!-- Minikube -->
  <rect x="350" y="120" width="470" height="400" rx="12" fill="#fff8e1" stroke="#ffa000" stroke-width="2"/>
  <text x="585" y="150" text-anchor="middle" font-weight="bold" fill="#e65100">Minikube Cluster</text>

  <!-- Ingress -->
  <rect x="400" y="180" width="140" height="60" rx="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="470" y="205" text-anchor="middle" font-weight="bold">Ingress</text>
  <text x="470" y="225" text-anchor="middle" font-size="12">petclinic.local</text>

  <!-- Service -->
  <rect x="580" y="180" width="140" height="60" rx="8" fill="#ffecb3" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="650" y="205" text-anchor="middle" font-weight="bold">Service</text>
  <text x="650" y="225" text-anchor="middle" font-size="12">petclinic:80</text>

  <!-- Flèche Ingress → Service -->
  <line x1="540" y1="210" x2="580" y2="210" stroke="#333" marker-end="url(#arrow)"/>

  <!-- PetClinic Pods -->
  <rect x="400" y="270" width="320" height="80" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
  <text x="560" y="295" text-anchor="middle" font-weight="bold">PetClinic Pods (Deployment)</text>
  <text x="560" y="315" text-anchor="middle" font-size="12">2-5 replicas • HPA • Port 30080</text>

  <!-- Flèche Service → Pods -->
  <line x1="650" y1="240" x2="650" y2="270" stroke="#333" marker-end="url(#arrow)"/>

  <!-- MySQL -->
  <rect x="400" y="380" width="320" height="80" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="560" y="405" text-anchor="middle" font-weight="bold">MySQL (StatefulSet)</text>
  <text x="560" y="425" text-anchor="middle" font-size="12">mysql-0 • PVC • Port 3306</text>

  <!-- Flèche PetClinic → MySQL -->
  <line x1="560" y1="350" x2="560" y2="380" stroke="#333" marker-end="url(#arrow)"/>
  <text x="575" y="365" text-anchor="start" font-size="12" fill="#555">JDBC</text>

  <!-- Secrets & ConfigMap -->
  <rect x="740" y="270" width="120" height="190" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="800" y="295" text-anchor="middle" font-weight="bold">Config</text>
  <rect x="750" y="310" width="100" height="30" rx="5" fill="#e1bee7"/>
  <text x="800" y="330" text-anchor="middle" font-size="11">Secret</text>
  <text x="800" y="345" text-anchor="middle" font-size="10">• MYSQL_USER</text>
  <text x="800" y="360" text-anchor="middle" font-size="10">• MYSQL_PASSWORD</text>
  <rect x="750" y="380" width="100" height="30" rx="5" fill="#e1bee7"/>
  <text x="800" y="400" text-anchor="middle" font-size="11">ConfigMap</text>
  <text x="800" y="415" text-anchor="middle" font-size="10">• DB URL</text>

  <!-- Flèches vers Secrets -->
  <line x1="720" y1="310" x2="740" y2="325" stroke="#7b1fa2" stroke-dasharray="3,3"/>
  <line x1="720" y1="400" x2="740" y2="395" stroke="#7b1fa2" stroke-dasharray="3,3"/>

  <!-- Définition de la flèche -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>